name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Run the smoke tests in chromium, firefox and webkit'
        type: choice
        options: [chromium, all]
        default: chromium

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # The e2e specs compare against these tools (ffmpeg/ffprobe, qpdf, exiftool); they skip when missing.
      - name: Install ffmpeg, qpdf and exiftool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg qpdf libimage-exiftool-perl
      - run: npm run check
      - run: npm test
      - name: Build (analytics off)
        run: npm run build
      - name: Notices are up to date
        run: git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: llms.txt is up to date
        run: git diff --exit-code static/llms.txt
      - name: Smoke tests (analytics off)
        run: npm run e2e
      - name: Build and test (analytics on, fake host)
        env:
          PUBLIC_UMAMI_WEBSITE_ID: test
          PUBLIC_UMAMI_HOST_URL: https://umami.invalid
          PUBLIC_UMAMI_DOMAINS: localhost
          ANALYTICS_BUILD: '1'
        run: |
          npx vite build
          npx playwright test analytics

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build with the repository's analytics variables
        env:
          # The website ID is public (it is in the page). Repository variables override these defaults.
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || '65f9c9af-18ef-45a8-9f6f-52f3987c5eba' }}
          PUBLIC_UMAMI_HOST_URL: ${{ vars.PUBLIC_UMAMI_HOST_URL || 'https://cloud.umami.is' }}
          PUBLIC_UMAMI_DOMAINS: ${{ vars.PUBLIC_UMAMI_DOMAINS || 'img-tools.fyi,www.img-tools.fyi' }}
          PUBLIC_ANALYTICS_CONSENT: ${{ vars.PUBLIC_ANALYTICS_CONSENT || 'opt-out' }}
        run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
